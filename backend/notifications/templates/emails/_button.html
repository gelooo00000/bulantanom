{% comment %}Bulletproof-ish CTA. Outlook ignores border-radius, which is fine; the link under it covers clients that drop the button entirely.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" class="bt-btn" style="margin:30px 0 0;">
  <tr><td bgcolor="#2f8a45" style="background:#2f8a45;background-image:linear-gradient(135deg,#4cbf5c,#2f8a45);border-radius:999px;box-shadow:0 6px 16px rgba(47,138,69,0.28);">
    <a href="{{ login_url }}" style="display:inline-block;padding:14px 32px;font-family:'Nunito','Segoe UI',Arial,sans-serif;color:#ffffff;font-size:16px;font-weight:800;text-decoration:none;letter-spacing:0.01em;">
      Sign in to BulanTanom &rarr;
    </a>
  </td></tr>
</table>
<p style="margin:14px 0 0;font-size:12px;line-height:1.6;color:#6b7a68;">
  Button not working? Open this link:<br>
  <a href="{{ login_url }}" style="color:#2f8a45;font-weight:700;word-break:break-all;">{{ login_url }}</a>
</p>

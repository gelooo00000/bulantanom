{% comment %}
Shared shell for every lifecycle email. Table-based and inline-styled on
purpose: email clients strip <style> blocks and ignore flexbox, so the
app's Tailwind tokens cannot be reused here.
{% endcomment %}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f6f8f3;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c2119;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f8f3;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #dbe0d4;border-radius:12px;overflow:hidden;">

        <tr><td style="background:#2f6b3d;padding:20px 28px;">
          <span style="color:#ffffff;font-size:18px;font-weight:600;letter-spacing:-0.01em;">🌱 BulanTanom</span>
          <div style="color:#cfe4d4;font-size:12px;margin-top:2px;">Layuan Nature Integrated Farm</div>
        </td></tr>

        <tr><td style="padding:28px;">
          {% block content %}{% endblock %}
        </td></tr>

        <tr><td style="background:#eef1e9;padding:16px 28px;border-top:1px solid #dbe0d4;">
          <p style="margin:0;font-size:12px;line-height:1.6;color:#767e71;">
            This message was sent because your BulanTanom account changed status.
            BulanTanom will never ask you for your password by email.
            If you did not expect this, contact your farm administrator.
          </p>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>

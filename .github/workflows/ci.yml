# Runs on every push to main. The backend runs on Postgres because production
# does; local development uses MySQL, so this is where a difference shows up.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bulantanom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      # Off, every test request is redirected to HTTPS.
      DJANGO_DEBUG: "True"
      DB_ENGINE: postgresql
      DB_NAME: bulantanom
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # mysqlclient compiles against the MySQL client library.
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements.txt
      # Known vulnerabilities in the Python packages, as npm audit does above.
      - run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

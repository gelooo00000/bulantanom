# Render's free plan has no cron, so this calls the API's daily jobs: harvest
# notifications and the retry of failed emails. 22:00 UTC is 06:00 in Manila.
# Needs the repository secret DAILY_JOBS_SECRET, equal to the same variable on
# bulantanom-api. --retry covers the API's cold start.
name: Daily jobs

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the daily jobs endpoint
        env:
          DAILY_JOBS_SECRET: ${{ secrets.DAILY_JOBS_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 30 --retry-all-errors --max-time 170 \
            --request POST \
            --header "X-Jobs-Secret: $DAILY_JOBS_SECRET" \
            https://bulantanom-api.onrender.com/api/jobs/daily/

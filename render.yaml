# Render Blueprint: Django API (Docker) + Next.js frontend.
# The database is an external Neon Postgres (free tier): Render allows only
# one free database per account, and this account's is already in use.
# Apply it from the Render dashboard: New > Blueprint > pick this repo.
#
# The two public URLs below assume Render grants the service names as-is
# (https://<name>.onrender.com). If a name was taken, Render adds a suffix:
# update NEXT_PUBLIC_API_URL, CORS_ALLOWED_ORIGINS and FRONTEND_URL to the
# real URLs, then redeploy the frontend (NEXT_PUBLIC_* is baked in at build).

services:
  - type: web
    name: bulantanom-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # RENDER_EXTERNAL_HOSTNAME is added to both automatically in settings.
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"

      - key: DB_ENGINE
        value: postgresql
      # Neon connection details, entered when the Blueprint is applied.
      # Use the direct (non "-pooler") host.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # The browser reaches the API through the frontend's own /api/ (see
      # src/proxy.ts), so its cookies are first-party. SameSite=None stays so
      # a direct call to this host keeps working too.
      - key: CORS_ALLOWED_ORIGINS
        value: https://bulantanom.onrender.com
      - key: FRONTEND_URL
        value: https://bulantanom.onrender.com
      - key: REFRESH_COOKIE_SAMESITE
        value: None
      - key: REFRESH_COOKIE_SECURE
        value: "True"

      # Secrets: Render prompts for these when the Blueprint is applied.
      - key: GEMINI_API_KEY
        sync: false
      # First Admin account, created on boot (no shell on the free tier).
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        value: Admin
      - key: DJANGO_SUPERUSER_LAST_NAME
        value: BulanTanom
      # Leave EMAIL_HOST empty to log emails instead of sending them.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Render's free plan blocks outbound 25, 465 and 587.
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: BulanTanom <bulantanom.official@gmail.com>
      # Evidence photos; without it they land on disk and vanish on deploy.
      - key: CLOUDINARY_URL
        sync: false
      # Must equal the GitHub secret used by .github/workflows/daily-jobs.yml.
      - key: DAILY_JOBS_SECRET
        sync: false
      # Shared with the frontend, which sends it with the visitor's address
      # for the sign-in rate limits (accounts.throttles.client_ip).
      - key: API_PROXY_SECRET
        generateValue: true

  - type: web
    name: bulantanom
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_API_URL
        value: https://bulantanom-api.onrender.com/api
      # Same value as on bulantanom-api: proves forwarded requests came from here.
      - key: API_PROXY_SECRET
        fromService:
          type: web
          name: bulantanom-api
          envVarKey: API_PROXY_SECRET
